[workspace]
resolver = "2"
members = [
    "crates/ttobak-core",
    "crates/ttobak-audio",
    "crates/ttobak-stt",
    "crates/ttobak-macos",
    "src-tauri",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dirs = "6.0"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
