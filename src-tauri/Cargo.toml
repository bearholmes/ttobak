[package]
name = "ttobak-app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ttobak-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ttobak-core = { path = "../crates/ttobak-core" }
ttobak-audio = { path = "../crates/ttobak-audio" }
ttobak-stt = { path = "../crates/ttobak-stt" }
ttobak-macos = { path = "../crates/ttobak-macos" }
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
